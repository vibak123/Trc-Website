<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Techtrons Robotics Club | Portal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

  <!-- Tabs -->
  <div class="form-tabs">
    <button onclick="switchTab('login')">Login</button>
    <button onclick="switchTab('register')">Register</button>
  </div>

  <div id="auth-alert"></div>

  <!-- LOGIN -->
  <div id="login-panel">
    <h2>Login</h2>
    <form onsubmit="handleLogin(event)">
      <input type="tel" id="login-mobile" placeholder="Mobile" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit" id="login-btn">Login</button>
    </form>
    <p>No account? 
      <a href="javascript:void(0)" onclick="switchTab('register')">Register</a>
    </p>
  </div>

  <!-- REGISTER -->
  <div id="register-panel" style="display:none;">
    <h2>Register</h2>
    <form onsubmit="handleRegister(event)">
      <input type="text" id="reg-name" placeholder="Name" required>
      <input type="text" id="reg-course" placeholder="Course" required>
      <input type="tel" id="reg-mobile" placeholder="Mobile" required>
      <input type="email" id="reg-email" placeholder="Email" required>
      <input type="password" id="reg-password" placeholder="Password" required>
      <button type="submit" id="register-btn">Register</button>
    </form>
    <p>Already have account? 
      <a href="javascript:void(0)" onclick="switchTab('login')">Login</a>
    </p>
  </div>

</div>

<!-- ✅ Firebase + Logic -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDocs, collection, query, where }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDfFd87JukSkB1v-jAs2bLVG-OlKNJ4w5k",
  authDomain: "trc-portal-3b6de.firebaseapp.com",
  projectId: "trc-portal-3b6de",
  storageBucket: "trc-portal-3b6de.firebasestorage.app",
  messagingSenderId: "608154775398",
  appId: "1:608154775398:web:71a7b6d7cb7729c465a2a7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.switchTab = (tab) => {
  document.getElementById("login-panel").style.display = tab === "login" ? "block" : "none";
  document.getElementById("register-panel").style.display = tab === "register" ? "block" : "none";
};

window.handleRegister = async (e) => {
  e.preventDefault();

  const name = document.getElementById("reg-name").value;
  const course = document.getElementById("reg-course").value;
  const mobile = document.getElementById("reg-mobile").value;
  const email = document.getElementById("reg-email").value;
  const password = document.getElementById("reg-password").value;

  try {
    const check = await getDocs(query(collection(db,"users"), where("mobile","==",mobile)));
    if (!check.empty) {
      alert("Mobile already exists");
      return;
    }

    const userCred = await createUserWithEmailAndPassword(auth, email, password);

    await setDoc(doc(db,"users", userCred.user.uid), {
      name, course, mobile, email
    });

    alert("Registered Successfully");
    switchTab("login");

  } catch (err) {
    alert(err.message);
  }
};

window.handleLogin = async (e) => {
  e.preventDefault();

  const mobile = document.getElementById("login-mobile").value;
  const password = document.getElementById("login-password").value;

  try {
    const snap = await getDocs(query(collection(db,"users"), where("mobile","==",mobile)));

    if (snap.empty) {
      alert("User not found");
      return;
    }

    const user = snap.docs[0].data();

    await signInWithEmailAndPassword(auth, user.email, password);

    alert("Login success");
    window.location.href = "student.html";

  } catch (err) {
    alert(err.message);
  }
};

</script>

</body>
</html>
